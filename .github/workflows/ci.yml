name: CI

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake rpm

      - name: Configure CMake
        run: cmake -B _build

      - name: Build
        run: cmake --build _build

      - name: Build DEB package
        run: |
          cd _build
          cpack -G DEB

      - name: Build RPM package
        run: |
          cd _build
          cpack -G RPM

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B _build

      - name: Build
        run: cmake --build _build --config Release

      - name: Build WIX package
        run: |
          cd _build
          cpack -G WIX
