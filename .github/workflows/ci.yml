name: CI

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake rpm

      - name: Configure CMake
        run: cmake -B _build

      - name: Build
        run: cmake --build _build

      - name: Build DEB package
        run: |
          cd _build
          cpack -G DEB

      - name: Build RPM package
        run: |
          cd _build
          cpack -G RPM

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            _build/*.deb
            _build/*.rpm

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B _build

      - name: Build
        run: cmake --build _build --config Release

      - name: Build WIX package
        run: |
          cd _build
          cpack -G WIX

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: _build/*.msi

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B _build

      - name: Build
        run: cmake --build _build --config Release

      - name: Build DragNDrop package
        run: |
          cd _build
          cpack -G DragNDrop

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: _build/*.dmg

  create-release:
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: ls -la release-files

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-files/* \
            --generate-notes
